{% extends 'base.html' %}
{% block title %}Đăng ký{% endblock %}
{% block lop_noi_dung %}rong{% endblock %}
{% block lop_thong_bao %}khung{% endblock %}

{% block content %}
  <div class="trang-dn">
    <div class="trang-dn-khung">
      <div class="hop-form">
        <h1>Tạo tài khoản</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form.html' %}
          <button class="btn btn-lon rong-het" type="submit">Tạo tài khoản</button>
        </form>
        <p>Đã có tài khoản? <a href="{% url 'dang_nhap' %}">Đăng nhập</a></p>
      </div>
    </div>
  </div>
{% endblock %}
